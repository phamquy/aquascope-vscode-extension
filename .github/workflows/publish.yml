# Builds the extension's VSIX packages, attaches them to a GitHub release and publishes them to the VS Code
# Marketplace.
#
# Pushing a tag `v<version>`, where <version> is package.json's, releases that version. Each package must be
# built and tested on its own platform (features 005 and 012), so one job per platform runs `npm run package`
# on a GitHub-hosted runner of that platform; the release job then attaches both packages to the tag's
# release, creating it if needed, and the publish job publishes them. Running the workflow by hand (Run
# workflow on the Actions tab, or `gh workflow run publish.yml --ref <branch>`) is a dry run: it builds both
# packages and keeps them as the run's artifacts, and releases and publishes nothing.
#
# It signs in with the Marketplace's Trusted Publishing, so no token is stored: the `psyquy` publisher holds a
# policy naming this repository and this file, and renaming the file breaks it. DEVELOPMENT.md's section on
# publishing has the release steps.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      # A dry run reports both platforms, even when one fails.
      fail-fast: false
      matrix:
        include:
          # Apple silicon.
          - target: darwin-arm64
            runner: macos-15
          # Visual Studio 2022, as on the Windows 11 machine the package was verified on.
          - target: win32-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read # check out the repository
    defaults:
      run:
        # Git for Windows' Bash on Windows.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check that the tag names package.json's version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match package.json's version $version; tag v$version instead"
            exit 1
          fi

      - run: npm ci

      # Installs the pinned nightly, builds Aquascope, runs the full test suite against the bundle and checks
      # the VSIX (DEVELOPMENT.md's section on building a package).
      - name: Build, test and check the package
        run: npm run package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ matrix.target }}
          path: aquascope-vscode-extension-${{ matrix.target }}-*.vsix
          if-no-files-found: error
          compression-level: 0 # a VSIX is already a zip

  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the packages
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true

      # A release made by hand for the tag gets the packages too; one of the same name is replaced.
      - name: Attach the packages to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" vsix/*.vsix --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" vsix/*.vsix --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # sign in to the Marketplace
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true

      # vsce 4 needs Node 22 and is the first version with --oidc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The publisher, version and target platform come from each package's own manifest. A package whose
      # version and platform are already on the Marketplace is skipped, so re-running a run that published
      # only some of them publishes the rest.
      - name: Publish them
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --skip-duplicate --packagePath vsix/*.vsix
